spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hytodo}
    username: ${DB_USERNAME:hytodo}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: debug


